[package]
name = "coin-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "runtime"] }
uuid = { version = "1", features = ["serde", "v4"] }
dotenv = "0.15"
redis = { version = "0.23", features = ["tokio-comp"] }
chrono = "0.4"
