# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: retesp-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retesp}
      POSTGRES_USER: ${POSTGRES_USER:-retesp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retesp123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retesp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retesp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: retesp-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - retesp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: retesp-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    networks:
      - retesp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:0.5.7
    container_name: retesp-ollama
    restart: always
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - retesp-network
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_MODELS=/root/.ollama/models

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: retesp-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retesp}:${POSTGRES_PASSWORD:-retesp123}@db:5432/${POSTGRES_DB:-retesp}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RUST_LOG: ${RUST_LOG:-info}
      API_URL: http://backend:8080
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - retesp-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retesp-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8081}
    depends_on:
      - backend
    networks:
      - retesp-network

  social_service:
    build: 
      context: ./social_service
      dockerfile: Dockerfile
    container_name: retesp-social
    restart: always
    ports:
      - "${SOCIAL_PORT:-8082}:8002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retesp}:${POSTGRES_PASSWORD:-retesp123}@db:5432/${POSTGRES_DB:-retesp}
      REDIS_URL: redis://redis:6379
      API_URL: http://social_service:8002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retesp-network

  reports_service:
    build: 
      context: ./reports_service
      dockerfile: Dockerfile
    container_name: retesp-reports
    restart: always
    ports:
      - "${REPORTS_PORT:-8083}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retesp}:${POSTGRES_PASSWORD:-retesp123}@db:5432/${POSTGRES_DB:-retesp}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retesp-network

  notification_worker:
    build: 
      context: ./notification_worker
      dockerfile: Dockerfile
    container_name: retesp-notify
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retesp}:${POSTGRES_PASSWORD:-retesp123}@db:5432/${POSTGRES_DB:-retesp}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retesp-network

  coin_engine:
    build: 
      context: ./coin_engine
      dockerfile: Dockerfile
    container_name: retesp-coins
    restart: always
    ports:
      - "${COIN_PORT:-8084}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retesp}:${POSTGRES_PASSWORD:-retesp123}@db:5432/${POSTGRES_DB:-retesp}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retesp-network

  ai_service:
    build: 
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: retesp-ai
    restart: always
    ports:
      - "${AI_PORT:-8085}:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379
    depends_on:
      - ollama
      - redis
    networks:
      - retesp-network

  video_ai:
    build: 
      context: ./video_ai
      dockerfile: Dockerfile
    container_name: retesp-video-ai
    restart: always
    ports:
      - "${VIDEO_AI_PORT:-8086}:8001"
    environment:
      OLLAMA_URL: http://ollama:11434
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      REDIS_URL: redis://redis:6379
    depends_on:
      - ollama
      - minio
      - redis
    networks:
      - retesp-network

networks:
  retesp-network:
    driver: bridge
    name: retesp-network

volumes:
  postgres_data:
    name: retesp-postgres-data
  minio_data:
    name: retesp-minio-data
  ollama_data:
    name: retesp-ollama-data